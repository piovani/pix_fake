services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dict
      POSTGRES_PASSWORD: dict
      POSTGRES_DB: dict
    ports:
      - "5432:5432"
    volumes:
      - dict-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dict -d dict"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  dict-pgdata:
