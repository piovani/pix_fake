services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: spi
      POSTGRES_PASSWORD: spi
      POSTGRES_DB: spi
    ports:
      - "5433:5432"
    volumes:
      - spi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spi -d spi"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  spi-pgdata:
