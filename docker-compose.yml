name: pixfake

services:
  postgres-dict:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dict
      POSTGRES_PASSWORD: dict
      POSTGRES_DB: dict
    ports:
      - "5432:5432"
    volumes:
      - dict-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dict -d dict"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres-spi:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: spi
      POSTGRES_PASSWORD: spi
      POSTGRES_DB: spi
    ports:
      - "5433:5432"
    volumes:
      - spi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spi -d spi"]
      interval: 2s
      timeout: 3s
      retries: 15

  dict:
    build: ./mock/dict
    environment:
      DICT_ADDR: ":8080"
      DICT_DATABASE_URL: postgres://dict:dict@postgres-dict:5432/dict?sslmode=disable
      DICT_CONTROL: ${DICT_CONTROL:-on}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    ports:
      - "8080:8080"
    depends_on:
      postgres-dict:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 15

  spi:
    build: ./mock/spi
    environment:
      SPI_ADDR: ":8081"
      SPI_DATABASE_URL: postgres://spi:spi@postgres-spi:5432/spi?sslmode=disable
      SPI_CONTROL: ${SPI_CONTROL:-on}
      # How long a payment waits for the receiving participant (the Pix limit is 40 seconds), and how long a read
      # waits for a message before answering that there is none.
      SPI_TIMEOUT: ${SPI_TIMEOUT:-40s}
      SPI_POLL_WAIT: ${SPI_POLL_WAIT:-5s}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    ports:
      - "8081:8081"
    depends_on:
      postgres-spi:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Grafana with Prometheus (metrics), Loki (logs) and Tempo (traces) behind an OpenTelemetry collector, in one image
  # meant for development. The wallet, run with go run, sends to localhost:4318.
  lgtm:
    image: grafana/otel-lgtm:0.41.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000" # Grafana
      - "4318:4318" # OTLP over HTTP
    volumes:
      - ./monitoring/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/pixfake.yaml:ro
      - ./monitoring/dashboards:/otel-lgtm/pixfake-dashboards:ro
      - lgtm-data:/data
    # the stack takes a minute or two to start, longer than the image's own check allows
    healthcheck:
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 3m

volumes:
  lgtm-data:
  dict-pgdata:
  spi-pgdata:
