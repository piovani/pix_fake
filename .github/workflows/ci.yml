# Every job runs a make target, so a failure here is reproduced with the same command locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 6" # Saturday 06:00 in São Paulo: new vulnerabilities show up without a push

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # the newest 1.27 patch: go-version-file would pin the go directive (1.27.3), which has fixed vulnerabilities
  GO_VERSION: "1.27"

jobs:
  lint:
    name: gofmt, go vet, go mod tidy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - run: make lint
      - run: make tidy

  staticcheck:
    name: staticcheck
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - run: make staticcheck

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - run: make vuln

  proto:
    name: generated gRPC code is up to date
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - uses: arduino/setup-protoc@v3
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: make proto-check

  unit:
    name: unit and HTTP tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: "**/go.sum"
      # the SPI tests check the messages it writes against the official XSDs with xmllint
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: make test

  integration:
    name: tests on PostgreSQL
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: make test-integration

  e2e:
    name: end to end and coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: "**/go.sum"
      # make coverage runs make e2e with covered binaries, then the unit tests, and merges both
      - run: make coverage
        env:
          COVERAGE_MIN: "85"
          E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: .coverage/
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e-logs/
          if-no-files-found: ignore

  containers:
    name: containers and compose
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - run: make setup
      - run: make check
      - if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: make down
