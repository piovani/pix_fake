version: 2

updates:
  - package-ecosystem: gomod
    directories:
      - /mock/dict
      - /mock/spi
      - /wallet
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: America/Sao_Paulo
    groups:
      go-modules:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
