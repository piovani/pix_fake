syntax = "proto3";

package wallet.v1;

import "google/protobuf/timestamp.proto";

option go_package = "pixfake/wallet/gen/wallet/v1;walletv1";

// KeyService manages the Pix keys of the wallet's accounts, in the DICT and in the wallet's own records.
service KeyService {
  // RegisterKey errors: ALREADY_EXISTS (the key is registered, here or elsewhere), INVALID_ARGUMENT, NOT_FOUND (account).
  rpc RegisterKey(RegisterKeyRequest) returns (RegisterKeyResponse);

  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse);

  // RemoveKey is not an error for a key that is already gone.
  rpc RemoveKey(RemoveKeyRequest) returns (RemoveKeyResponse);
}

enum KeyType {
  KEY_TYPE_UNSPECIFIED = 0;
  KEY_TYPE_CPF = 1;
  KEY_TYPE_CNPJ = 2;
  KEY_TYPE_PHONE = 3;
  KEY_TYPE_EMAIL = 4;
  KEY_TYPE_EVP = 5; // random, generated by the DICT
}

message Key {
  string key = 1;
  KeyType type = 2;
  string account_id = 3;
  google.protobuf.Timestamp created_at = 4;
}

message RegisterKeyRequest {
  string account_id = 1;
  KeyType type = 2;
  // Empty for KEY_TYPE_EVP. A CPF or CNPJ key must be the holder's.
  string key = 3;
  // A UUID v4.
  string request_id = 4;
}

message RegisterKeyResponse {
  Key key = 1;
}

message ListKeysRequest {
  string account_id = 1;
}

message ListKeysResponse {
  repeated Key keys = 1;
}

message RemoveKeyRequest {
  string account_id = 1;
  string key = 2;
}

message RemoveKeyResponse {}
