// The wallet's public gRPC contract. The generated code goes to ../../../../gen (make proto) and is what clients use.
//
// First draft: one call, only to prove the toolchain. The real contract is designed with the features
// (keys, payments, statement) and versioned by the package, so a breaking change becomes wallet.v2.
syntax = "proto3";

package wallet.v1;

option go_package = "pixfake/wallet/gen/wallet/v1;walletv1";

service WalletService {
  // GetBalance returns the available balance of an account.
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
}

message GetBalanceRequest {
  string account_id = 1;
}

// Money is always an integer number of centavos (BRL), never a float.
message GetBalanceResponse {
  int64 available_cents = 1;
  // Part of the balance held by payments still in flight; not available to spend.
  int64 reserved_cents = 2;
}
